[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/mini-app/Dockerfile"
watchPatterns = [
  "artifacts/mini-app/**",
  "scripts/serve-spa.mjs",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "artifacts/mini-app/railway.toml",
]

[deploy]
# No startCommand — runtime uses the Dockerfile's CMD
# (`node scripts/serve-spa.mjs dist/public`). The runtime image doesn't
# install pnpm, so overriding to a pnpm command would fail to start.
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
