[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/mini-app/Dockerfile"
watchPatterns = [
  "artifacts/mini-app/**",
  "scripts/serve-spa.mjs",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "artifacts/mini-app/railway.toml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
startCommand = "pnpm run start:mini-app"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
