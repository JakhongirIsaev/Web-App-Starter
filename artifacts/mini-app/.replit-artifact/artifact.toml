kind = "web"
previewPath = "/mini-app/"
title = "Minerva Mini App"
version = "1.0.0"
id = "artifacts/mini-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mini-app/" ]
localPort = 18801

[services.development]
run = "pnpm --filter @workspace/mini-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mini-app", "run", "build" ]

[services.production.run]
args = [ "node", "scripts/serve-spa.mjs", "artifacts/mini-app/dist/public" ]

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "18801"
BASE_PATH = "/mini-app/"
