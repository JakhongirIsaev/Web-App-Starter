[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/api-server/Dockerfile"
buildCommand = "pnpm --filter @workspace/api-server build"
# api-server also serves the mini-app and admin SPA bundles, so it must rebuild
# whenever those workspaces change — not just on api-server source edits.
watchPatterns = [
  "artifacts/api-server/**",
  "artifacts/mini-app/**",
  "artifacts/admin/**",
  "lib/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "artifacts/api-server/railway.toml",
]

[deploy]
healthcheckPath = "/api/healthz"
# 60s is enough for the API to come up; the seed runs in the background and
# is gated by SEED_DATABASE_ON_BOOT (default: off in production). A longer
# window means a stuck container blocks the deploy without failing fast.
healthcheckTimeout = 60
startCommand = "pnpm run start:api-server"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
