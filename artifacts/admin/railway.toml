[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/admin/Dockerfile"
watchPatterns = [
  "artifacts/admin/**",
  "scripts/serve-spa.mjs",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "artifacts/admin/railway.toml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
startCommand = "pnpm run start:admin"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
