kind = "web"
previewPath = "/"
title = "Minerva Admin"
version = "1.0.0"
id = "artifacts/admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23744

[services.development]
run = "pnpm --filter @workspace/admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin", "run", "build" ]

[services.production.run]
args = [ "node", "scripts/serve-spa.mjs", "artifacts/admin/dist/public" ]

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "23744"
BASE_PATH = "/"
